  """Registros de ejecución de pasos del plan por sesión."""
  sessionPlanSteps(sessionId: ID, planStepId: ID, planId: ID, isCompleted: Boolean): [SessionPlanStepType]
  patientGrowth: [GrowthPointType]
  scales(scaleType: String, search: String, page: Int = 1, pageSize: Int = 10): PaginatedScales
  scale(id: ID!): ScaleType
  scaleEvaluations(
    patientId: ID
    scaleId: ID
    inSession: Boolean

    """Busca por nombre del paciente o nombre de la escala."""
    search: String
    page: Int = 1
    pageSize: Int = 10
  ): PaginatedScaleEvaluations
  scaleEvaluation(id: ID!): ScaleEvaluationType
  forms(search: String, page: Int = 1, pageSize: Int = 10): PaginatedForms
  form(id: ID!): FormType
  formAssignments(assignedToId: ID, patientId: ID, formId: ID, sessionId: ID, page: Int = 1, pageSize: Int = 10): PaginatedFormAssignments
  formAssignment(id: ID!): FormAssignmentType
  discounts: [DiscountType]
  payments(patientId: ID, paymentStatus: String, search: String, page: Int = 1, pageSize: Int = 10): PaginatedPaymentType
  payment(id: ID!): PaymentType
  expenses(
    status: String
    category: String

    """Busca por descripción o categoría del gasto."""
    search: String
    page: Int = 1
    pageSize: Int = 10
  ): PaginatedExpenses
  courses(state: String, search: String, page: Int = 1, pageSize: Int = 10): PaginatedCourses
  course(id: ID!): CourseType
  courseEnrollments(courseId: ID, page: Int = 1, pageSize: Int = 10): PaginatedCourseEnrollments
  institutions(search: String, page: Int = 1, pageSize: Int = 10): PaginatedInstitutions
  institution(id: ID!): InstitutionType
  institutionGroup(id: ID!): InstitutionGroupType
  institutionGroups(institutionId: ID!, page: Int = 1, pageSize: Int = 10): PaginatedInstitutionGroups
  blogPosts(status: String, search: String, type: String, page: Int = 1, pageSize: Int = 10): PaginatedBlogPosts
  blogPost(id: ID!): BlogPostType
  marketingCampaigns(status: String, platform: String, page: Int = 1, pageSize: Int = 10): PaginatedCampaigns
  marketingCampaign(id: ID!): MarketingCampaignType
  leads(campaignId: ID, status: String, search: String, page: Int = 1, pageSize: Int = 10): PaginatedLeads
  lead(id: ID!): LeadType
  sessions(
    patientId: ID
    therapistId: ID

    """individual | group"""
    sessionType: String

    """paid | pending | exempt"""
    paymentStatus: String

    """completa | confirma | agendada | reprograma | cancelada"""
    sessionStatus: String

    """Filtra sesiones con fecha >= date_from (YYYY-MM-DD)."""
    dateFrom: Date

    """Filtra sesiones con fecha <= date_to (YYYY-MM-DD)."""
    dateTo: Date

    """
    Si True incluye sesiones sin fecha (agendadas sin asignar). Solo aplica cuando se usa date_from/date_to.
    """
    includeNoDate: Boolean = true

    """Busca por nombre o apellido del paciente."""
    search: String
    page: Int = 1
    pageSize: Int = 10

    """False → paginación normal de sesiones. True → paginación por ciclos."""
    byCycles: Boolean = false
  ): PaginatedSessions

  """
  Paginación por ciclos. Disponible también desde `sessions(byCycles: true)`.
  """
  paginatedCycles(
    patientId: ID
    therapistId: ID

    """Filtra ciclos con sesiones >= date_from."""
    dateFrom: Date

    """Filtra ciclos con sesiones <= date_to."""
    dateTo: Date
    page: Int = 1
    pageSize: Int = 10
  ): PaginatedCycles
  session(id: ID!): SessionType
  digitalResources(type: String, search: String, page: Int, pageSize: Int): PaginatedDigitalResources
  digitalResource(id: ID!): DigitalResourceType
  inventoryItems(status: String, type: String, search: String, page: Int = 1, pageSize: Int = 10): PaginatedInventoryItems
  inventoryItem(id: ID!): InventoryItemType

  """Ciclos de sesiones de un paciente, agrupados por cycle_number."""
  patientCycles(patientId: ID!): [CycleType]

  """Ciclos de todos los pacientes, ordenados por paciente y cycle_number."""
  allPatientCycles: [CycleType]

  """
  Lista paginada de pacientes con la información de su último ciclo y sus sesiones.
  """
  patientsLastCycle(
    therapistId: ID

    """Busca por nombre o apellido del paciente."""
    search: String
    page: Int = 1
    pageSize: Int = 10
  ): PaginatedPatientsLastCycle
  me: UserType
  users(search: String, roleName: String, excludeRole: String, page: Int = 1, pageSize: Int = 10): PaginatedUsers
  user(id: ID!): UserType
  roles(search: String, page: Int = 1, pageSize: Int = 10): PaginatedRoles
