services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      MULTIMODAL_PROJECT_ROOT: /app
      MULTIMODAL_PYTHON: /usr/local/bin/python
      MULTIMODAL_DEMO_MODE: "true"
    volumes:
      - ..:/app:cached
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    # Ensure it uses the same network as the root compose
    networks:
      - cbm-network
    depends_on:
      - db

  worker:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      MULTIMODAL_PROJECT_ROOT: /app
      MULTIMODAL_PYTHON: /usr/local/bin/python
      MULTIMODAL_DEMO_MODE: "true"
    working_dir: /app
    volumes:
      - ..:/app:cached
    command: sh -c "python manage.py migrate pipeline_multimodal --noinput && python manage.py procesar_pipeline_multimodal --poll-seconds 5"
    networks:
      - cbm-network
    depends_on:
      - db

  db:
    # Use the same configuration as the root compose for the DB
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cbm-network

networks:
  cbm-network:
    driver: bridge

volumes:
  postgres_data:

