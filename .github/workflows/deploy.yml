name: Backend DevSecOps

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: config.settings

jobs:
  fast-checks:
    name: "Phase 1 - Quality and secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-django-secret-not-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q .
          python manage.py check
          python manage.py makemigrations --check --dry-run

  sast:
    name: "Phase 2 - CodeQL SAST"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

  dependency-security:
    name: "Phase 3 - Dependency security"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict

      - name: Scan source tree with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-filesystem.sarif
          exit-code: "1"
          ignore-unfixed: true

      - name: Show Trivy findings when the scan fails
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table

      - name: Upload Trivy filesystem report
        if: ${{ always() && hashFiles('trivy-filesystem.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-filesystem.sarif

      - name: Upload security artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-filesystem
          path: trivy-filesystem.sarif
          if-no-files-found: ignore
          retention-days: 30

  tests:
    name: "Phase 4 - Django tests and coverage"
    runs-on: ubuntu-24.04
    needs: fast-checks
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_cbm
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_cbm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      POSTGRES_DB: test_cbm
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_ENCRYPTION_KEY_ID: ci-test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt coverage

      - name: Run Django checks
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          coverage run --branch manage.py test --verbosity=2
          coverage xml -o coverage.xml
          coverage report --fail-under=${{ vars.BACKEND_MINIMUM_COVERAGE || 0 }}

      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  sonar:
    name: "Phase 5 - SonarQube"
    runs-on: ubuntu-24.04
    needs: tests
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: SonarQube not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SonarQube is not configured; continuing without the optional quality gate."

      - name: Checkout
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: .

      - name: Run SonarQube quality gate
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >-
            -Dsonar.projectKey=cbm-backend
            -Dsonar.sources=.
            -Dsonar.exclusions=**/migrations/**,**/tests/**,**/.venv/**,**/venv/**
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

  docker:
    name: "Phase 6 - Build and scan Docker image"
    runs-on: ubuntu-24.04
    needs: [fast-checks, dependency-security, tests, sast]
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: cbm-backend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.5
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
          ignore-unfixed: true

      - name: Show image vulnerabilities in logs
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          trivy image "$IMAGE" \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table

      - name: Upload image report
        if: ${{ always() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Upload image artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-image
          path: trivy-image.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    name: "Phase 7 - Deploy backend"
    runs-on: ubuntu-24.04
    needs: [tests, sast, dependency-security, docker, sonar]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/master' &&
        needs.tests.result == 'success' &&
        needs.sast.result == 'success' &&
        needs.dependency-security.result == 'success' &&
        needs.docker.result == 'success' &&
        (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
      }}
    environment: production
    timeout-minutes: 20
    steps:
      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Verify SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'echo SSH connection OK'

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" bash -s <<'DEPLOY_EOF'
          set -euo pipefail
          cd ~/cbm-backend
          git fetch origin master
          git reset --hard origin/master
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          pm2 restart cbm-backend
          pm2 save
          DEPLOY_EOF

      - name: Verify deployed health endpoint
        if: ${{ vars.BACKEND_HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL }}
        run: curl --fail --show-error --silent --retry 10 --retry-delay 5 "$HEALTHCHECK_URL"

  dast:
    name: "Phase 8 - OWASP ZAP staging scan"
    runs-on: ubuntu-24.04
    needs: deploy
    if: >-
      ${{
        needs.deploy.result == 'success' &&
        github.ref == 'refs/heads/master' &&
        vars.BACKEND_STAGING_URL != ''
      }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.BACKEND_STAGING_URL }}
          fail_action: true
          allow_issue_writing: false

  load-test:
    name: "Phase 9 - k6 staging load test"
    runs-on: ubuntu-24.04
    needs: dast
    if: >-
      ${{
        needs.dast.result == 'success' &&
        vars.BACKEND_K6_SCRIPT != '' &&
        vars.BACKEND_STAGING_URL != ''
      }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: ${{ vars.BACKEND_K6_SCRIPT }}
        env:
          TARGET_URL: ${{ vars.BACKEND_STAGING_URL }}
